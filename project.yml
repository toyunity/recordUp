name: recordup
options:
  bundleIdPrefix: com.toyunity
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_NAME: recordup
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/WhisperKit
    from: "1.0.0"

targets:
  recordup:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/recordup
      - path: Resources/prompts
        type: folder
        buildPhase: resources
      - path: Resources/models
        type: folder
        buildPhase: resources
        optional: true
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/release-notes.json
        buildPhase: resources
      - path: Resources/ai-tools.json
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: recordup
        CFBundleDisplayName: record-up
        CFBundleIdentifier: com.toyunity.recordup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        NSAppleEventsUsageDescription: "record-up이 Claude Code CLI를 호출해 회의록을 자동 생성합니다."
        NSDocumentsFolderUsageDescription: "전사본과 회의록을 ~/Documents/record-up 에 저장합니다."
        NSDownloadsFolderUsageDescription: "다운로드한 음성 메모를 처리합니다."
        NSDesktopFolderUsageDescription: "데스크톱의 음성 메모를 처리합니다."
        NSMicrophoneUsageDescription: "(향후 v2) 앱 내 직접 녹음을 위해 필요합니다."
        LSApplicationCategoryType: public.app-category.productivity
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: ArgmaxOSS
        product: SpeakerKit
    settings:
      base:
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSUIElement: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
